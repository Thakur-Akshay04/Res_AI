<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/Title.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="AI Resume Builder - Create ATS-optimized resumes with AI-powered generation, real-time scoring, and PDF export." />
  <title>AI Resume Builder — Intelligent ATS-Optimized Resumes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    @keyframes aura-breath {
      0% {
        transform: translate(-50%, -50%) scale(0.95);
        opacity: 0.6;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.08);
        opacity: 0.85;
      }
    }

    @keyframes spin-x {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(180deg) rotateZ(360deg); }
    }

    @keyframes spin-y {
      0% { transform: rotateX(180deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(180deg) rotateY(360deg) rotateZ(360deg); }
    }

    @keyframes spin-z {
      0% { transform: rotateX(0deg) rotateY(180deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(180deg) rotateZ(360deg); }
    }

    @keyframes letter-reveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.4), 0 0 20px rgba(139, 92, 246, 0.25);
      }
    }

    @keyframes progress-fill {
      0% {
        width: 0%;
      }
      60% {
        width: 75%;
      }
      100% {
        width: 100%;
      }
    }

    @keyframes sk-fade {
      0% {
        opacity: 1;
        pointer-events: all;
      }
      100% {
        opacity: 0;
        pointer-events: none;
      }
    }

    @keyframes text-pulse {
      0%, 100% {
        opacity: 0.45;
      }
      50% {
        opacity: 0.85;
      }
    }

    #app-skeleton {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
      background-size: 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: sk-fade 0.35s cubic-bezier(0.4, 0, 0.2, 1) 0.65s forwards;
      overflow: hidden;
    }

    .sk-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, #ffffff 0%, rgba(139, 92, 246, 0.8) 50%, #ffffff 100%);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.4), 0 0 15px rgba(139, 92, 246, 0.2);
      animation: progress-fill 0.75s cubic-bezier(0.15, 0.85, 0.15, 1) forwards;
      z-index: 10000;
    }

    .sk-ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      top: 50%;
      left: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.16) 0%, rgba(6, 182, 212, 0.09) 45%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      animation: aura-breath 4s ease-in-out infinite alternate;
      z-index: 1;
    }

    .sk-center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .sk-gyro-container {
      position: relative;
      width: 90px;
      height: 90px;
      perspective: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .sk-gyro-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .sk-gyro-ring.one {
      width: 76px;
      height: 76px;
      border-top-color: #8b5cf6;
      border-bottom-color: #8b5cf6;
      animation: spin-x 2.5s linear infinite;
      filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.5));
    }

    .sk-gyro-ring.two {
      width: 56px;
      height: 56px;
      border-left-color: #06b6d4;
      border-right-color: #06b6d4;
      animation: spin-y 2s linear infinite;
      filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.5));
    }

    .sk-gyro-ring.three {
      width: 36px;
      height: 36px;
      border-top-color: #ffffff;
      border-bottom-color: #ffffff;
      animation: spin-z 1.2s linear infinite;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.7));
    }

    .sk-wordmark {
      display: flex;
      gap: 3px;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .sk-letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(12px) scale(0.9);
      animation: letter-reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .sk-status-ticker {
      font-family: monospace;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      animation: text-pulse 1.8s ease-in-out infinite;
    }

    .sk-cursor {
      display: inline-block;
      width: 6px;
      height: 10px;
      background-color: #06b6d4;
      margin-left: 5px;
      box-shadow: 0 0 6px rgba(6, 182, 212, 0.8);
      animation: text-pulse 0.8s ease-in-out infinite;
    }
  </style>

  <div id="app-skeleton" aria-hidden="true">
    <div class="sk-progress-bar"></div>
    <div class="sk-ambient-glow"></div>
    <div class="sk-center-content">
      <div class="sk-gyro-container">
        <div class="sk-gyro-ring one"></div>
        <div class="sk-gyro-ring two"></div>
        <div class="sk-gyro-ring three"></div>
      </div>
      <div class="sk-wordmark">
        <span class="sk-letter" style="animation-delay: 0.05s;">R</span>
        <span class="sk-letter" style="animation-delay: 0.12s;">e</span>
        <span class="sk-letter" style="animation-delay: 0.19s;">s</span>
        <span class="sk-letter" style="animation-delay: 0.26s;">u</span>
        <span class="sk-letter" style="animation-delay: 0.33s;">A</span>
        <span class="sk-letter" style="animation-delay: 0.40s;">I</span>
      </div>
      <div class="sk-status-ticker">
        <span>INITIALIZING WORKSPACE</span>
        <span class="sk-cursor"></span>
      </div>
    </div>
  </div>
  <script>
    if (window.location.pathname !== '/') {
      var loader = document.getElementById('app-skeleton');
      if (loader) loader.style.display = 'none';
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
