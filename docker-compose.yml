services:
  # ─── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: resucraft-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai-resume-builder
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - resucraft-network

  # ─── Backend (Express API) ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resucraft-backend
    restart: unless-stopped
    ports:
      - "5050:5000"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      MONGO_URI: mongodb://mongo:27017/ai-resume-builder
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: "http://localhost"
    networks:
      - resucraft-network

  # ─── Frontend (Nginx + React) ────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_YXNzdXJlZC1zdW5iZWFtLTgxLmNsZXJrLmFjY291bnRzLmRldiQ}
        VITE_API_URL: "/api"
    container_name: resucraft-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - resucraft-network

volumes:
  mongo_data:

networks:
  resucraft-network:
    driver: bridge
